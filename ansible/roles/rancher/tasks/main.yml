---
- name: Validate Rancher and CA inputs
  ansible.builtin.assert:
    that:
      - rancher_hostname | length > 0
      - rancher_ingress_address | length > 0
      - internal_ca_cert_path | length > 0
      - internal_ca_key_path | length > 0

- name: Check local private CA material on the Ansible controller
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  loop: ["{{ internal_ca_cert_path }}", "{{ internal_ca_key_path }}"]
  register: ca_files

- name: Require local private CA material
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Create or obtain the internal CA certificate and key on the Ansible control host; never commit them."
  loop: "{{ ca_files.results }}"
  no_log: true

- name: Download Helm
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3
    mode: "0700"

- name: Install Helm
  ansible.builtin.command: /tmp/get-helm-3
  args: { creates: /usr/local/bin/helm }

- name: Add Helm repositories
  ansible.builtin.command: "helm repo add {{ item.name }} {{ item.url }}"
  changed_when: false
  loop:
    - { name: jetstack, url: https://charts.jetstack.io }
    - { name: ingress-nginx, url: https://kubernetes.github.io/ingress-nginx }
    - { name: rancher-stable, url: https://releases.rancher.com/server-charts/stable }

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Install cert-manager
  ansible.builtin.command: >-
    helm upgrade --install cert-manager jetstack/cert-manager
    --namespace cert-manager --create-namespace
    --version {{ cert_manager_version }} --set crds.enabled=true
  changed_when: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for cert-manager deployment
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n cert-manager rollout status deployment/cert-manager --timeout=180s
  changed_when: false

- name: Create the Rancher namespace before creating its TLS secrets
  ansible.builtin.shell: >-
    /usr/local/bin/k3s kubectl create namespace cattle-system
    --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
  args: { executable: /bin/bash }
  changed_when: false

- name: Copy internal CA material to bootstrap host temporarily
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { src: "{{ internal_ca_cert_path }}", dest: /run/aqtech-root-ca.crt }
    - { src: "{{ internal_ca_key_path }}", dest: /run/aqtech-root-ca.key }
  no_log: true

- name: Create the Rancher private-CA ingress certificate and Kubernetes secrets
  ansible.builtin.shell: |
    set -euo pipefail
    openssl req -new -newkey rsa:2048 -nodes \
      -keyout /run/rancher-ingress.key \
      -out /run/rancher-ingress.csr \
      -subj '/CN={{ rancher_hostname }}' \
      -addext 'subjectAltName=DNS:{{ rancher_hostname }}'
    openssl x509 -req -sha256 -days 825 \
      -in /run/rancher-ingress.csr \
      -CA /run/aqtech-root-ca.crt \
      -CAkey /run/aqtech-root-ca.key \
      -CAcreateserial \
      -out /run/rancher-ingress.crt \
      -copy_extensions copy
    /usr/local/bin/k3s kubectl -n cattle-system create secret tls tls-rancher-ingress \
      --cert=/run/rancher-ingress.crt --key=/run/rancher-ingress.key \
      --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
    /usr/local/bin/k3s kubectl -n cattle-system create secret generic tls-ca \
      --from-file=cacerts.pem=/run/aqtech-root-ca.crt \
      --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
  args: { executable: /bin/bash }
  no_log: true

- name: Remove temporary private CA and ingress certificate files from bootstrap host
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /run/aqtech-root-ca.crt
    - /run/aqtech-root-ca.key
    - /run/rancher-ingress.key
    - /run/rancher-ingress.csr
    - /run/rancher-ingress.crt
    - /run/aqtech-root-ca.srl
  no_log: true

- name: Install ingress-nginx with kube-vip LoadBalancer address
  ansible.builtin.command: >-
    helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
    --namespace ingress-nginx --create-namespace
    --set controller.service.loadBalancerClass=kube-vip.io/kube-vip-class
    --set controller.service.loadBalancerIP={{ rancher_ingress_address }}
  changed_when: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for ingress-nginx controller and admission webhook
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl -n ingress-nginx rollout status
    deployment/ingress-nginx-controller --timeout=300s
  changed_when: false

- name: Install Rancher HA
  ansible.builtin.command: >-
    helm upgrade --install rancher rancher-stable/rancher
    --namespace cattle-system --create-namespace
    --version {{ rancher_chart_version }}
    --set hostname={{ rancher_hostname }}
    --set replicas={{ rancher_replicas }}
    --set ingress.ingressClassName=nginx
    --set ingress.tls.source=secret
    --set privateCA=true
  changed_when: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Rancher rollout
  ansible.builtin.command: /usr/local/bin/k3s kubectl -n cattle-system rollout status deployment/rancher --timeout=600s
  changed_when: false
